name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.0). Leave empty to only build APK artifact.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest

      - name: Decode Release Keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks

      - name: Build Release APK
        env:
          SIGNING_STORE_FILE: release-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean Up Keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Rename APK Artifact
        env:
          VER_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'snapshot' }}
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/TrueBlock-${VER_NAME}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrueBlock-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'snapshot' }}
          path: app/build/outputs/apk/release/TrueBlock-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/TrueBlock-*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          name: TrueBlock ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
