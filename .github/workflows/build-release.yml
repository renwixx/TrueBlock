name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.3.1). Leave empty to update latest-build pre-release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compute Build Metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VER_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_STABLE="true"
            REL_TAG="${GITHUB_REF_NAME}"
            VER_NAME="${GITHUB_REF_NAME#v}"
            APK_NAME="TrueBlock-${GITHUB_REF_NAME}.apk"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ inputs.tag_name }}" ]]; then
            IS_STABLE="true"
            REL_TAG="${{ inputs.tag_name }}"
            VER_NAME="${REL_TAG#v}"
            APK_NAME="TrueBlock-${REL_TAG}.apk"
          else
            IS_STABLE="false"
            REL_TAG="latest-build"
            VER_NAME="1.3.0-b${GITHUB_RUN_NUMBER}"
            APK_NAME="TrueBlock-latest.apk"
          fi
          echo "is_stable=${IS_STABLE}" >> "$GITHUB_OUTPUT"
          echo "rel_tag=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "ver_code=${VER_CODE}" >> "$GITHUB_OUTPUT"
          echo "ver_name=${VER_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testReleaseUnitTest

      - name: Decode Release Keystore
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > release-keystore.jks

      - name: Build Release APK
        env:
          BUILD_VERSION_CODE: ${{ steps.meta.outputs.ver_code }}
          BUILD_VERSION_NAME: ${{ steps.meta.outputs.ver_name }}
          BUILD_COMMIT: ${{ steps.meta.outputs.short_sha }}
          SIGNING_STORE_FILE: release-keystore.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Clean Up Keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Prepare APK and Update Manifest
        env:
          REL_TAG: ${{ steps.meta.outputs.rel_tag }}
          VER_CODE: ${{ steps.meta.outputs.ver_code }}
          VER_NAME: ${{ steps.meta.outputs.ver_name }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          OUT_DIR="app/build/outputs/apk/release"
          cp "${OUT_DIR}/app-release.apk" "${OUT_DIR}/${APK_NAME}"
          APK_SHA256=$(sha256sum "${OUT_DIR}/${APK_NAME}" | awk '{print $1}')
          COMMIT_MSG=$(git log -1 --pretty=%s)
          export APK_SHA256 COMMIT_MSG
          python3 - <<'PY'
          import json, os
          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["REL_TAG"]
          apk = os.environ["APK_NAME"]
          data = {
            "versionCode": int(os.environ["VER_CODE"]),
            "versionName": os.environ["VER_NAME"],
            "commit": os.environ["SHORT_SHA"],
            "notes": os.environ["COMMIT_MSG"],
            "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk}",
            "sha256": os.environ["APK_SHA256"],
          }
          with open("app/build/outputs/apk/release/update.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
          PY

      - name: Move Rolling Pre-release Tag
        if: steps.meta.outputs.is_stable == 'false'
        run: |
          git tag -f latest-build
          git push --force origin latest-build

      - name: Publish Rolling Pre-release (Direct APK)
        if: steps.meta.outputs.is_stable == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest Build (${{ steps.meta.outputs.ver_name }} • ${{ steps.meta.outputs.short_sha }})
          prerelease: true
          make_latest: false
          files: |
            app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
            app/build/outputs/apk/release/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Stable GitHub Release
        if: steps.meta.outputs.is_stable == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.rel_tag }}
          name: TrueBlock ${{ steps.meta.outputs.rel_tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}
            app/build/outputs/apk/release/update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
